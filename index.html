<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="Marco Scatassi — portfolio e spazio personale.">
  <title>Marco Scatassi | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f7fb;
      --ink: #17283b;
      --muted: #526174;
      --yellow: #a87900;
      --pink: #d93670;
      --cyan: #087f9c;
      --line: rgba(23,40,59,.16);
      --mouse-x: 50vw;
      --mouse-y: 30vh;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 1;
      background:
        radial-gradient(550px circle at var(--mouse-x) var(--mouse-y), rgba(8,127,156,.09), transparent 70%),
        linear-gradient(rgba(8,127,156,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(8,127,156,.035) 1px, transparent 1px);
      background-size: auto, 42px 42px, 42px 42px;
      mask-image: none;
    }
    #ambient-canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; opacity:.65; }
    .shell { position:relative; z-index:1; width:min(1152px,100%); min-height:calc(100svh - 64px); margin:auto; padding:clamp(14px,2.5vh,28px) 24px 18px; display:flex; flex-direction:column; }
    .site-header { position:sticky; top:0; z-index:100; background:rgba(245,248,252,.82); backdrop-filter:blur(18px); border-bottom:1px solid rgba(0,174,202,.15); }
    .navbar { max-width:1024px; height:64px; padding:0 24px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .logo { color:var(--ink); font-size:18px; font-weight:800; letter-spacing:-.025em; text-decoration:none; display:flex; align-items:center; gap:12px; }
    .logo-context { color:#94a3b8; font-size:12px; font-weight:500; letter-spacing:0; }
    .logo-dot { display:inline-block; flex:0 0 11px; width:11px; height:11px; border-radius:50%; background:#00aeca; box-shadow:0 0 14px rgba(0,174,202,.6); animation:pulse 2s infinite; }
    .top-note { color:var(--muted); font-size:12px; font-weight:700; }
    .gradient-text { background:linear-gradient(110deg,var(--cyan),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .intro { display:flex; flex-direction:column; align-items:center; text-align:center; margin:clamp(28px,6vh,64px) 0 clamp(26px,5vh,52px); }
    .eyebrow { display:block; margin:0 0 14px; color:#d93670; font:600 11px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0; font:750 clamp(30px,4.2vw,52px)/1.08 Inter,sans-serif; letter-spacing:-.035em; text-transform:none; white-space:nowrap; }
    .subtitle { max-width:680px; margin:16px 0 0; color:var(--muted); font-size:15px; line-height:1.6; }
    .section-label { display:flex; align-items:center; gap:12px; margin:0 0 26px; color:#526174; font:500 10px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.13em; text-transform:uppercase; }
    .section-label::after { content:""; flex:1; height:1px; background:var(--line); }
    .chip-stage { position:relative; display:flex; flex-direction:row; align-items:flex-start; justify-content:center; gap:clamp(70px,15vw,190px); padding:10px 8px 20px; }
    .chip-option { display:flex; flex-direction:column; align-items:center; gap:14px; }
    .chip { --accent:var(--cyan); position:relative; display:block; width:86px; height:176px; padding:0; border:0; border-radius:0; color:inherit; background:transparent; cursor:pointer; transition:transform .22s ease,filter .22s ease; }
    .chip.personal { --accent:var(--pink); }
    .chip:hover,.chip:focus-visible { transform:translateY(-5px) rotate(-2deg); filter:drop-shadow(0 12px 12px rgba(23,40,59,.2)); outline:none; }
    .chip:focus-visible { outline:2px solid var(--accent); outline-offset:9px; border-radius:7px; }
    .chip:disabled { cursor:wait; }
    .usb-drive { position:absolute; inset:27px 6px 0; display:block; overflow:visible; border:1px solid color-mix(in srgb,var(--accent) 65%,#263d50); border-radius:9px 9px 5px 5px; background:linear-gradient(160deg,#fdfefe 0%,#dce6ed 48%,#b8c8d4 100%); box-shadow:inset 0 2px 3px rgba(255,255,255,.95),inset 0 -4px 8px rgba(23,40,59,.16),0 7px 13px rgba(23,40,59,.17); }
    .usb-drive::before { content:""; position:absolute; z-index:2; top:-25px; left:50%; right:auto; width:26px; height:26px; transform:translateX(-50%); border:1px solid #788b99; border-bottom:0; border-radius:3px 3px 0 0; background:linear-gradient(180deg,#8799a6,#e5ebef 65%,#aebbc4); box-shadow:0 -2px 3px rgba(23,40,59,.12); }
    .usb-drive::after { content:""; position:absolute; z-index:3; top:-19px; left:calc(50% - 3px); right:auto; width:6px; height:17px; border-left:2px solid #657987; border-right:2px solid #657987; opacity:.9; }
    .usb-inlay { position:absolute; inset:7px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:8px 0; border:1px solid color-mix(in srgb,var(--accent) 35%,transparent); border-radius:5px; background:linear-gradient(115deg,rgba(255,255,255,.8),color-mix(in srgb,var(--accent) 8%,#dce6ed)); }
    .usb-mark { display:grid; place-items:center; width:43px; height:43px; border:1px solid color-mix(in srgb,var(--accent) 55%,#718096); border-radius:6px; color:var(--accent); background:rgba(255,255,255,.7); font-size:17px; box-shadow:inset 0 0 12px color-mix(in srgb,var(--accent) 12%,transparent); }
    .usb-led { position:absolute; right:9px; bottom:9px; width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
    .chip-label { color:var(--ink); font:700 15px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:-.02em; }
    .chip.personal + .chip-label { color:var(--pink); }
    .chip.professional + .chip-label { color:var(--cyan); }
    .mini-reader { --accent:var(--cyan); display:flex; align-items:center; justify-content:space-between; gap:10px; width:176px; height:42px; padding:6px 12px; position:relative; z-index:3; border:1px solid color-mix(in srgb,var(--accent) 45%,#8194a3); border-radius:7px; background:linear-gradient(180deg,#e6edf3,#d5e0e9); box-shadow:0 4px 9px rgba(23,40,59,.12),inset 0 1px 3px rgba(255,255,255,.9); }
    .mini-reader.personal { --accent:var(--pink); }
    .reader-slot { position:relative; width:30px; height:7px; overflow:hidden; border:1px solid #31485b; border-radius:3px; background:linear-gradient(180deg,#17283b,#344b5e); box-shadow:inset 0 2px 4px rgba(0,0,0,.55); }
    .reader-slot::after { content:""; position:absolute; inset:2px 5px; border-radius:2px; background:var(--accent); opacity:.25; transition:opacity .25s,box-shadow .25s; }
    .mini-reader.is-active .reader-slot::after { opacity:1; box-shadow:0 0 8px var(--accent); }
    .mini-reader.is-inserted { box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent),0 5px 15px rgba(23,40,59,.18),inset 0 1px 3px rgba(255,255,255,.9); }
    .reader-led { width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.75; box-shadow:0 0 6px var(--accent); }
    .reader-label { color:#526174; font:700 7px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; white-space:nowrap; }
    .dock { display:none; }
    .dock::before { content:""; position:absolute; inset:7px; border:1px solid rgba(255,255,255,.75); border-radius:8px; pointer-events:none; }
    .dock-label { margin-bottom:11px; color:#526174; font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.16em; text-transform:uppercase; }
    .dock-slot { position:relative; width:150px; height:23px; overflow:hidden; border:1px solid #31485b; border-radius:4px; background:linear-gradient(180deg,#17283b,#344b5e); box-shadow:inset 0 3px 7px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.9); }
    .dock-slot::after { content:""; position:absolute; inset:8px 9px; border-radius:2px; background:#00aeca; opacity:.2; transition:opacity .25s,box-shadow .25s; }
    .dock.is-active .dock-slot::after { opacity:1; box-shadow:0 0 13px #00aeca,0 0 25px rgba(0,174,202,.8); }
    .dock-status { min-height:13px; margin:8px 0 0; color:#64748b; font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em; text-transform:uppercase; }
    .dock.is-active .dock-status { color:#087f9c; }
    .chip-flight { position:fixed!important; z-index:2!important; margin:0!important; pointer-events:none!important; transform-origin:top left; transition:none!important; }
    .bottomline { display:flex; justify-content:space-between; gap:15px; margin-top:auto; padding-top:24px; color:#64748b; font:9px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
    @keyframes pulse { 0%,100% { box-shadow:0 0 8px rgba(8,127,156,.4); } 50% { box-shadow:0 0 20px rgba(8,127,156,.9); } }
    @media(max-width:700px) {
      .shell { width:min(100% - 30px,540px); padding:12px 0 10px; }
      .navbar { height:58px; }
      .top-note { font-size:10px; }
      .intro { margin:22px 0 26px; }
      h1 { font-size:clamp(18px,6.1vw,30px); letter-spacing:-.045em; }
      .subtitle { margin-top:10px; font-size:13px; }
      .chip-stage { flex-direction:row; gap:clamp(38px,12vw,72px); padding:2px 0 5px; }
      .chip-option { gap:10px; }
      .chip { width:76px; height:154px; }
      .usb-drive { inset:23px 5px 0; }
      .usb-drive::before { left:50%; right:auto; top:-23px; width:24px; height:24px; transform:translateX(-50%); }
      .usb-drive::after { top:-17px; left:calc(50% - 3px); right:auto; height:15px; }
      .usb-inlay { inset:5px; padding:7px 0; }
      .usb-mark { width:29px; height:29px; font-size:13px; }
      .chip-label { font-size:13px; }
      .mini-reader { width:150px; height:36px; }
      .reader-slot { width:28px; }
      .bottomline { margin-top:auto; padding-top:16px; font-size:8px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important; } .character:hover { transform:none; } }
  </style>
</head>
<body>
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>
  <header class="site-header">
    <div class="navbar">
      <a href="index.html" class="logo" aria-label="Home">
        <span class="logo-dot"></span>
        <span>Marco Scatassi <span class="logo-context">| Personal Hub</span></span>
      </a>
      <div class="top-note">Portfolio &amp; Spazio Personale</div>
    </div>
  </header>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Portfolio &amp; personal</p>
      <h1 id="page-title" class="gradient-text">Scegli da dove iniziare</h1>
      <p class="subtitle">Due aree, un unico spazio. Seleziona quella che vuoi visitare.</p>
    </section>
    <section aria-label="Scegli una sezione">
      <div class="chip-stage" aria-label="Seleziona un chip da inserire nel proprio lettore">
        <div class="chip-option">
          <div class="mini-reader" id="reader-portfolio" aria-hidden="true"><span class="reader-label">PORT 01</span><span class="reader-slot" id="slot-portfolio"></span><span class="reader-led"></span></div>
          <button class="chip professional" type="button" data-target="portfolio.html" data-reader="portfolio" aria-label="Inserisci il chip Portfolio e apri il portfolio">
            <span class="usb-drive" aria-hidden="true"><span class="usb-inlay"><span class="usb-mark"><i class="fa-solid fa-terminal"></i></span><span class="chip-code">PH / 01</span><span class="usb-led"></span></span></span>
          </button>
          <span class="chip-label">Portfolio</span>
        </div>
        <div class="chip-option">
          <div class="mini-reader personal" id="reader-personal" aria-hidden="true"><span class="reader-label">PORT 02</span><span class="reader-slot" id="slot-personal"></span><span class="reader-led"></span></div>
          <button class="chip personal" type="button" data-target="personal.html" data-reader="personal" aria-label="Inserisci il chip Personal e apri lo spazio personale">
            <span class="usb-drive" aria-hidden="true"><span class="usb-inlay"><span class="usb-mark"><i class="fa-solid fa-compass"></i></span><span class="chip-code">PH / 02</span><span class="usb-led"></span></span></span>
          </button>
          <span class="chip-label">Personal</span>
        </div>
      </div>
    </section>
    <footer class="bottomline"><span>© Marco Scatassi</span><span>Personal Hub</span></footer>
  </main>
<script>
const finePointer=window.matchMedia('(pointer:fine)').matches,reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(finePointer&&!reducedMotion)window.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mouse-x',e.clientX+'px');document.documentElement.style.setProperty('--mouse-y',e.clientY+'px');},{passive:true});
const canvas=document.getElementById('ambient-canvas'),ctx=canvas.getContext('2d');let particles=[],width=0,height=0,animationFrame;
function resizeCanvas(){const dpr=Math.min(window.devicePixelRatio||1,1.5);width=window.innerWidth;height=window.innerHeight;canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:Math.min(48,Math.floor(width/28))},()=>({x:Math.random()*width,y:Math.random()*height,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,radius:1+Math.random()*1.4}));}
function drawNetwork(){ctx.clearRect(0,0,width,height);particles.forEach((p,i)=>{if(!reducedMotion){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>width)p.vx*=-1;if(p.y<0||p.y>height)p.vy*=-1;}ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fillStyle='rgba(8,127,156,.48)';ctx.fill();for(let j=i+1;j<particles.length;j++){const q=particles[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<112){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=`rgba(8,127,156,${(1-d/112)*.12})`;ctx.lineWidth=1;ctx.stroke();}}});if(!reducedMotion)animationFrame=requestAnimationFrame(drawNetwork);}
resizeCanvas();drawNetwork();window.addEventListener('resize',()=>{cancelAnimationFrame(animationFrame);resizeCanvas();drawNetwork();},{passive:true});

const chips=[...document.querySelectorAll('.chip')];
let loadingChip=false;
chips.forEach(chip=>chip.addEventListener('click',()=>{
  if(loadingChip)return;
  loadingChip=true;
  chips.forEach(item=>item.disabled=true);
  const target=chip.dataset.target;
  const reader=document.getElementById('reader-'+chip.dataset.reader);
  const slot=document.getElementById('slot-'+chip.dataset.reader);
  const from=chip.getBoundingClientRect(),to=slot.getBoundingClientRect();
  reader.classList.add('is-active');
  if(reducedMotion){window.location.assign(target);return;}
  const flight=chip.cloneNode(true);
  flight.classList.add('chip-flight');
  flight.removeAttribute('data-target');
  flight.setAttribute('aria-hidden','true');
  Object.assign(flight.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'});
  document.body.appendChild(flight);
  chip.style.visibility='hidden';
  const dx=to.left+to.width/2-(from.left+from.width/2);
  const dy=to.top+to.height/2-(from.top+14);
  const travel=Math.max(18,Math.abs(dy));
  const motion=flight.animate([
    {transform:'translate(0,0)',filter:'brightness(1)'},
    {transform:'translate('+dx+'px,'+(-travel*.78)+'px)',filter:'brightness(1.08)',offset:.72},
    {transform:'translate('+dx+'px,'+(-travel)+'px)',filter:'brightness(1.18)'}
  ],{duration:1050,easing:'cubic-bezier(.35,.05,.2,1)',fill:'forwards'});
  motion.onfinish=()=>{flight.remove();reader.classList.add('is-inserted');window.location.assign(target);};
}));
function resetChipInterface(){
  document.querySelectorAll('.chip-flight').forEach(element=>element.remove());
  chips.forEach(chip=>{chip.disabled=false;chip.style.visibility='';});
  document.querySelectorAll('.mini-reader').forEach(reader=>reader.classList.remove('is-active'));
  loadingChip=false;
}
window.addEventListener('pageshow',resetChipInterface);
window.addEventListener('pagehide',()=>{
  document.querySelectorAll('.chip-flight').forEach(element=>element.remove());
});
</script>
</body>
</html>
