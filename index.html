<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="Marco Scatassi — portfolio e spazio personale.">
  <title>Marco Scatassi | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f7fb;
      --ink: #17283b;
      --muted: #526174;
      --yellow: #a87900;
      --pink: #d93670;
      --cyan: #087f9c;
      --line: rgba(23,40,59,.16);
      --mouse-x: 50vw;
      --mouse-y: 30vh;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 1;
      background:
        radial-gradient(550px circle at var(--mouse-x) var(--mouse-y), rgba(8,127,156,.09), transparent 70%),
        linear-gradient(rgba(8,127,156,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(8,127,156,.035) 1px, transparent 1px);
      background-size: auto, 42px 42px, 42px 42px;
      mask-image: none;
    }
    #ambient-canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; opacity:.65; }
    .shell { position:relative; z-index:1; width:min(1152px,100%); margin:auto; padding:0 24px 22px; }
    .site-header { position:sticky; top:0; z-index:100; background:rgba(245,248,252,.82); backdrop-filter:blur(18px); border-bottom:1px solid rgba(0,174,202,.15); }
    .navbar { max-width:1024px; height:80px; padding:0 24px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .logo { color:var(--ink); font-size:18px; font-weight:800; letter-spacing:-.025em; text-decoration:none; display:flex; align-items:center; gap:12px; }
    .logo-context { color:#94a3b8; font-size:12px; font-weight:500; letter-spacing:0; }
    .logo-dot { display:inline-block; flex:0 0 11px; width:11px; height:11px; border-radius:50%; background:#00aeca; box-shadow:0 0 14px rgba(0,174,202,.6); animation:pulse 2s infinite; }
    .top-note { color:var(--muted); font-size:12px; font-weight:700; }
    .gradient-text { background:linear-gradient(110deg,var(--cyan),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .intro { display:flex; align-items:end; justify-content:space-between; gap:30px; margin:clamp(48px,8vh,82px) 0 32px; }
    .intro-copy { max-width:680px; }
    .eyebrow { display:flex; align-items:center; gap:9px; margin:0 0 12px; color:#d93670; font:600 10px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.13em; text-transform:uppercase; }
    .eyebrow::before { content:""; width:22px; height:3px; background:var(--pink); }
    h1 { margin:0; font:700 clamp(44px,7vw,76px)/.92 Inter,sans-serif; letter-spacing:-.025em; text-transform:uppercase; }
    h1 span { color:#d93670; }
    .subtitle { max-width:330px; margin:0 0 4px; color:var(--muted); font-size:14px; line-height:1.6; }
    .section-label { display:flex; align-items:center; gap:12px; margin:0 0 14px; color:#526174; font:500 10px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.13em; text-transform:uppercase; }
    .section-label::after { content:""; flex:1; height:1px; background:var(--line); }
    .chip-stage { position:relative; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:center; gap:clamp(18px,4vw,54px); min-height:330px; padding:30px clamp(8px,4vw,48px); }
    .chip { --accent:var(--cyan); position:relative; display:flex; flex-direction:column; align-items:stretch; min-height:190px; padding:19px 20px 17px; border:1px solid color-mix(in srgb,var(--accent) 65%,#17283b); border-radius:9px; color:var(--ink); text-align:left; background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(225,236,244,.96)); box-shadow:0 12px 28px rgba(23,40,59,.13),inset 0 0 0 4px rgba(255,255,255,.72),inset 0 -5px 0 color-mix(in srgb,var(--accent) 18%,transparent); cursor:pointer; isolation:isolate; transition:transform .22s ease,box-shadow .22s ease; }
    .chip.personal { --accent:var(--pink); }
    .chip::before { content:""; position:absolute; inset:8px; z-index:-1; border:1px solid color-mix(in srgb,var(--accent) 22%,transparent); border-radius:5px; pointer-events:none; }
    .chip:hover,.chip:focus-visible { transform:translateY(-5px) rotate(-1deg); box-shadow:0 18px 32px rgba(23,40,59,.18),inset 0 0 0 4px rgba(255,255,255,.72); outline:none; }
    .chip:focus-visible { outline:2px solid var(--accent); outline-offset:5px; }
    .chip:disabled { cursor:wait; }
    .chip-head,.chip-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .chip-brand { color:var(--accent); font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.16em; text-transform:uppercase; }
    .chip-code { color:#718096; font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .chip-core { display:flex; align-items:center; gap:14px; margin:24px 0 20px; }
    .chip-icon { display:grid; place-items:center; width:49px; height:49px; flex:0 0 49px; border:1px solid color-mix(in srgb,var(--accent) 55%,transparent); border-radius:5px; color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,white); font-size:21px; box-shadow:inset 0 0 15px color-mix(in srgb,var(--accent) 12%,transparent); }
    .chip h2 { margin:0; font:800 clamp(23px,3vw,32px)/1 Inter,sans-serif; letter-spacing:-.04em; text-transform:uppercase; }
    .chip-subtitle { margin:5px 0 0; color:#64748b; font-size:11px; }
    .chip-contacts { display:flex; align-items:center; gap:5px; }
    .chip-contacts span { display:block; width:17px; height:5px; border-radius:2px; background:linear-gradient(90deg,#a87900,#e8c56a); box-shadow:0 1px 1px rgba(23,40,59,.18); }
    .chip-foot { padding-top:11px; border-top:1px solid rgba(23,40,59,.12); color:#526174; font:700 9px Inter,system-ui,sans-serif; letter-spacing:.09em; text-transform:uppercase; }
    .dock { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; width:min(340px,100%); min-height:116px; margin:0 auto 5px; padding:17px 26px; border:1px solid rgba(8,127,156,.3); border-radius:12px; background:linear-gradient(180deg,#e6edf3,#d5e0e9); box-shadow:0 12px 25px rgba(23,40,59,.12),inset 0 2px 4px rgba(255,255,255,.9),inset 0 -5px 12px rgba(23,40,59,.08); }
    .dock::before { content:""; position:absolute; inset:7px; border:1px solid rgba(255,255,255,.75); border-radius:8px; pointer-events:none; }
    .dock-label { margin-bottom:11px; color:#526174; font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.16em; text-transform:uppercase; }
    .dock-slot { position:relative; width:150px; height:23px; overflow:hidden; border:1px solid #31485b; border-radius:4px; background:linear-gradient(180deg,#17283b,#344b5e); box-shadow:inset 0 3px 7px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.9); }
    .dock-slot::after { content:""; position:absolute; inset:8px 9px; border-radius:2px; background:#00aeca; opacity:.2; transition:opacity .25s,box-shadow .25s; }
    .dock.is-active .dock-slot::after { opacity:1; box-shadow:0 0 13px #00aeca,0 0 25px rgba(0,174,202,.8); }
    .dock-status { min-height:13px; margin:8px 0 0; color:#64748b; font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em; text-transform:uppercase; }
    .dock.is-active .dock-status { color:#087f9c; }
    .chip-flight { position:fixed!important; z-index:9999!important; margin:0!important; pointer-events:none!important; transform-origin:top left; transition:none!important; }
    .bottomline { display:flex; justify-content:space-between; gap:15px; margin-top:22px; color:#64748b; font:9px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
    @keyframes pulse { 0%,100% { box-shadow:0 0 8px rgba(8,127,156,.4); } 50% { box-shadow:0 0 20px rgba(8,127,156,.9); } }
    @media(max-width:700px) {
      .shell { width:min(100% - 30px,540px); padding-top:20px; }
      .top-note { font-size:11px; }
      .intro { display:block; margin:48px 0 28px; }
      .subtitle { margin-top:16px; max-width:420px; }
      .chip-stage { grid-template-columns:1fr; gap:15px; min-height:0; padding:12px 4px 20px; }
      .chip { min-height:166px; padding:16px 18px 14px; }
      .chip-core { margin:18px 0 15px; }
      .dock { min-height:108px; }
      .bottomline { font-size:8px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important; } .character:hover { transform:none; } }
  </style>
</head>
<body>
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>
  <header class="site-header">
    <div class="navbar">
      <a href="index.html" class="logo" aria-label="Home">
        <span class="logo-dot"></span>
        <span>Marco Scatassi <span class="logo-context">| Personal Hub</span></span>
      </a>
      <div class="top-note">Portfolio &amp; Spazio Personale</div>
    </div>
  </header>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <div class="intro-copy">
        <p class="eyebrow">Portfolio &amp; personal</p>
        <h1 id="page-title">Scegli da dove<br><span class="gradient-text">iniziare.</span></h1>
      </div>
      <p class="subtitle">Due aree, un unico spazio. Seleziona quella che vuoi visitare.</p>
    </section>
    <section aria-label="Scegli una sezione">
      <p class="section-label">Seleziona una sezione</p>
      <div class="chip-stage" aria-label="Seleziona un chip da inserire nel lettore">
        <button class="chip professional" type="button" data-target="portfolio.html" aria-label="Inserisci il chip Portfolio e apri il portfolio">
          <span class="chip-head"><span class="chip-brand">PERSONAL HUB / DATA CHIP</span><span class="chip-code">PH-01</span></span>
          <div class="chip-core"><span class="chip-icon"><i class="fa-solid fa-terminal" aria-hidden="true"></i></span><span><h2>Portfolio</h2><span class="chip-subtitle">Professional profile</span></div>
          <span class="chip-foot"><span>Load professional data</span><span class="chip-contacts" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span></span>
        </button>
        <button class="chip personal" type="button" data-target="personal.html" aria-label="Inserisci il chip Personal e apri lo spazio personale">
          <span class="chip-head"><span class="chip-brand">PERSONAL HUB / DATA CHIP</span><span class="chip-code">PH-02</span></span>
          <div class="chip-core"><span class="chip-icon"><i class="fa-solid fa-compass" aria-hidden="true"></i></span><span><h2>Personal</h2><span class="chip-subtitle">Personal archive</span></div>
          <span class="chip-foot"><span>Load personal data</span><span class="chip-contacts" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span></span>
        </button>
      </div>
      <div class="dock" id="chip-dock" aria-live="polite">
        <span class="dock-label">Neural interface / data port</span>
        <span class="dock-slot" id="dock-slot" aria-hidden="true"></span>
        <p class="dock-status" id="dock-status">Waiting for data chip</p>
      </div>
    </section>
    <footer class="bottomline"><span>© Marco Scatassi</span><span>Personal Hub</span></footer>
  </main>
<script>
const finePointer=window.matchMedia('(pointer:fine)').matches,reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(finePointer&&!reducedMotion)window.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mouse-x',e.clientX+'px');document.documentElement.style.setProperty('--mouse-y',e.clientY+'px');},{passive:true});
const canvas=document.getElementById('ambient-canvas'),ctx=canvas.getContext('2d');let particles=[],width=0,height=0,animationFrame;
function resizeCanvas(){const dpr=Math.min(window.devicePixelRatio||1,1.5);width=window.innerWidth;height=window.innerHeight;canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:Math.min(48,Math.floor(width/28))},()=>({x:Math.random()*width,y:Math.random()*height,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,radius:1+Math.random()*1.4}));}
function drawNetwork(){ctx.clearRect(0,0,width,height);particles.forEach((p,i)=>{if(!reducedMotion){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>width)p.vx*=-1;if(p.y<0||p.y>height)p.vy*=-1;}ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fillStyle='rgba(8,127,156,.48)';ctx.fill();for(let j=i+1;j<particles.length;j++){const q=particles[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<112){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=`rgba(8,127,156,${(1-d/112)*.12})`;ctx.lineWidth=1;ctx.stroke();}}});if(!reducedMotion)animationFrame=requestAnimationFrame(drawNetwork);}
resizeCanvas();drawNetwork();window.addEventListener('resize',()=>{cancelAnimationFrame(animationFrame);resizeCanvas();drawNetwork();},{passive:true});

const chips=[...document.querySelectorAll('.chip')],dock=document.getElementById('chip-dock'),slot=document.getElementById('dock-slot'),dockStatus=document.getElementById('dock-status');
let loadingChip=false;
chips.forEach(chip=>chip.addEventListener('click',()=>{
  if(loadingChip)return;
  loadingChip=true;
  chips.forEach(item=>item.disabled=true);
  const target=chip.dataset.target,from=chip.getBoundingClientRect(),to=slot.getBoundingClientRect();
  dock.classList.add('is-active');
  dockStatus.textContent='Chip detected / inserting...';
  if(reducedMotion){window.location.assign(target);return;}
  const flight=chip.cloneNode(true);
  flight.classList.add('chip-flight');
  flight.removeAttribute('data-target');
  flight.setAttribute('aria-hidden','true');
  Object.assign(flight.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'});
  document.body.appendChild(flight);
  chip.style.visibility='hidden';
  const dx=to.left-from.left+(to.width-from.width)/2;
  const dy=to.top-from.top+(to.height-from.height)/2;
  const sx=to.width/from.width,sy=to.height/from.height;
  const motion=flight.animate([
    {transform:'translate(0,0) scale(1)',opacity:1,filter:'brightness(1)'},
    {transform:`translate(${dx*.72}px,${dy*.72}px) scale(${1+(sx-1)*.72},${1+(sy-1)*.72})`,opacity:1,filter:'brightness(1.25)'},
    {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:.15,filter:'brightness(1.8)'}
  ],{duration:850,easing:'cubic-bezier(.2,.75,.25,1)',fill:'forwards'});
  motion.onfinish=()=>{flight.remove();dockStatus.textContent='Data chip accepted / loading...';window.location.assign(target);};
}));
</script>
</body>
</html>
