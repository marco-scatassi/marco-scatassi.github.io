<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="Marco Scatassi — portfolio e spazio personale.">
  <title>Marco Scatassi | Personal Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/design-system.css">
  <style>
    @view-transition { navigation: auto; }
    ::view-transition-group(hub-chip-flight) { animation-duration: 1.7s; animation-timing-function: cubic-bezier(.22,.8,.25,1); }
    ::view-transition-old(hub-chip-flight) { animation: none; opacity: 0; mix-blend-mode: normal; }
    ::view-transition-new(hub-chip-flight) { animation: none; opacity: 1; mix-blend-mode: normal; }

    :root {
      --paper: var(--ph-color-bg);
      --ink: var(--ph-color-ink);
      --muted: var(--ph-color-muted);
      --cyan: var(--ph-color-cyan);
      --pink: var(--ph-color-pink);
      --mouse-x: 50vw;
      --mouse-y: 42vh;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(560px circle at var(--mouse-x) var(--mouse-y), rgba(0,174,202,.12), transparent 70%),
        radial-gradient(500px circle at 82% 82%, rgba(232,62,145,.075), transparent 72%),
        linear-gradient(rgba(8,127,156,.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(8,127,156,.028) 1px, transparent 1px);
      background-size: auto, auto, 42px 42px, 42px 42px;
      mask-image: linear-gradient(to bottom, black, rgba(0,0,0,.7) 75%, transparent);
    }
    #ambient-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .42; }
    .viewport { position: relative; z-index: 1; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(22px,4vw,48px) clamp(22px,5.5vw,84px) clamp(18px,3vw,34px); }
    .signature, .coordinates, .bottom-note { color: #64748b; font: 600 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .14em; text-transform: uppercase; }
    .signature { display: flex; align-items: center; gap: 11px; }
    .signature-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 13px rgba(0,174,202,.7); }
    .coordinates { justify-self: end; }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .experience { position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: center; width: min(1120px,100%); margin: 0 auto; }
    .experience::before { content: ""; position: absolute; top: 14%; bottom: 14%; left: 50%; width: 1px; background: linear-gradient(transparent,rgba(23,40,59,.13) 22%,rgba(23,40,59,.13) 78%,transparent); }
    .choice {
      --accent: var(--cyan);
      position: relative; display: flex; min-width: 0; min-height: min(610px,70svh);
      flex-direction: column; align-items: center; justify-content: center;
      padding: 30px clamp(12px,4vw,52px); border: 0; border-radius: 0;
      color: var(--ink); background: transparent; cursor: pointer; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .choice.personal { --accent: var(--pink); }
    .choice::before {
      content: ""; position: absolute; z-index: -1; width: min(36vw,390px); aspect-ratio: 1;
      border-radius: 50%; background: var(--accent); opacity: .045; filter: blur(42px);
      transform: scale(.82); transition: opacity .45s ease, transform .65s cubic-bezier(.2,.75,.25,1);
    }
    .choice:hover::before, .choice:focus-visible::before { opacity: .105; transform: scale(1.08); }
    .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 24px; }
    .choice:disabled { cursor: wait; }
    .choice-index { display: flex; align-items: center; gap: 10px; margin-bottom: clamp(18px,3vh,32px); color: #718096; font: 600 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .17em; }
    .choice-index::before { content: ""; width: 22px; height: 1px; background: var(--accent); }
    .chip {
      --accent: var(--cyan); position: relative; display: block; width: clamp(105px,12vw,148px);
      height: clamp(174px,20vw,236px); margin: 0 0 clamp(26px,4vh,42px);
      pointer-events: none; color: inherit; filter: drop-shadow(0 22px 20px rgba(23,40,59,.14));
      transition: transform .55s cubic-bezier(.2,.75,.25,1), filter .55s ease;
    }
    .chip.personal { --accent: var(--pink); }
    .choice:hover .chip, .choice:focus-visible .chip { transform: translateY(-12px) rotate(-5deg) scale(1.035); filter: drop-shadow(0 32px 24px rgba(23,40,59,.2)); }
    .usb-drive {
      position: absolute; inset: 21px 10px 0; display: block; overflow: visible;
      border: 1px solid color-mix(in srgb,var(--accent) 48%,#b8c8d4); border-radius: 18px 18px 13px 13px;
      background: linear-gradient(135deg,#fff 0%,#eef3f7 38%,#cbd8e1 100%);
      box-shadow: inset 0 2px 3px rgba(255,255,255,.98),inset 0 -8px 16px rgba(23,40,59,.12),0 12px 22px rgba(23,40,59,.12);
    }
    .usb-drive::before { content: ""; position: absolute; z-index: 2; top: -22px; left: 50%; width: 43px; height: 23px; transform: translateX(-50%); border: 1px solid #9aaab5; border-bottom: 0; border-radius: 7px 7px 0 0; background: linear-gradient(180deg,#aab8c2,#f4f7f9 78%); }
    .usb-drive::after { content: ""; position: absolute; z-index: 3; top: -16px; left: calc(50% - 6px); width: 12px; height: 15px; border-left: 2px solid #718493; border-right: 2px solid #718493; opacity: .85; }
    .usb-inlay { position: absolute; inset: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 17px 0 13px; border: 1px solid color-mix(in srgb,var(--accent) 30%,transparent); border-radius: 11px; background: linear-gradient(145deg,rgba(255,255,255,.94),color-mix(in srgb,var(--accent) 8%,#e7edf2)); }
    .usb-mark { display: grid; place-items: center; width: 58px; height: 58px; border: 1px solid color-mix(in srgb,var(--accent) 36%,white); border-radius: 16px; color: var(--accent); background: rgba(255,255,255,.86); font-size: 23px; box-shadow: 0 6px 18px color-mix(in srgb,var(--accent) 13%,transparent); }
    .chip-code { color: #718096; font: 700 8px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .18em; }
    .usb-led { position: absolute; right: 11px; bottom: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .choice-name { margin: 0; color: var(--ink); font-size: clamp(31px,4vw,48px); font-weight: 800; letter-spacing: -.065em; line-height: 1; transition: color .3s ease; }
    .choice:hover .choice-name, .choice:focus-visible .choice-name { color: var(--accent); }
    .choice-description { margin: 13px 0 0; color: #64748b; font-size: 13px; line-height: 1.6; }
    .choice-cta { display: inline-flex; align-items: center; gap: 11px; margin-top: clamp(22px,3.5vh,36px); color: var(--accent); font: 700 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .13em; text-transform: uppercase; }
    .choice-cta i { transition: transform .3s ease; }
    .choice:hover .choice-cta i, .choice:focus-visible .choice-cta i { transform: translateX(6px); }
    .bottomline { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .bottom-note { letter-spacing: .11em; }
    .status { display: flex; align-items: center; gap: 8px; color: #718096; font: 600 9px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .12em; text-transform: uppercase; }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    @media (max-width: 700px) {
      body { overflow: auto; }
      .viewport { min-height: 100svh; padding: 22px 18px 18px; }
      .experience { width: min(560px,100%); }
      .choice { min-height: 60svh; padding: 22px 10px; }
      .choice-index { margin-bottom: 24px; font-size: 9px; }
      .chip { width: clamp(84px,17vw,112px); height: clamp(145px,29vw,180px); margin-bottom: 28px; }
      .usb-drive { inset: 17px 8px 0; }
      .usb-drive::before { top: -18px; width: 35px; height: 19px; }
      .usb-drive::after { top: -13px; }
      .usb-inlay { inset: 8px; padding: 13px 0 10px; }
      .usb-mark { width: 45px; height: 45px; font-size: 18px; }
      .choice-name { font-size: clamp(25px,5vw,34px); }
      .choice-description { max-width: 180px; font-size: 11px; }
      .choice-cta { font-size: 8px; letter-spacing: .08em; }
    }
    @media (max-width: 430px) {
      .viewport { padding: 20px 15px 16px; }
      .signature, .coordinates { font-size: 8px; }
      .experience { grid-template-columns: 1fr; align-content: center; padding: 20px 0; }
      .experience::before { top: 50%; right: 8%; bottom: auto; left: 8%; width: auto; height: 1px; background: linear-gradient(90deg,transparent,rgba(23,40,59,.15),transparent); }
      .choice { min-height: 0; display: grid; grid-template-columns: 78px minmax(0,1fr); grid-template-rows: auto auto auto; grid-template-areas: "chip index" "chip name" "chip desc" "chip cta"; justify-items: start; align-content: center; column-gap: 20px; row-gap: 5px; padding: 24px 12px; text-align: left; }
      .choice-index { grid-area: index; margin: 0 0 3px; }
      .chip { grid-area: chip; width: 65px; height: 108px; margin: 0; align-self: center; }
      .usb-drive { inset: 13px 5px 0; border-radius: 10px 10px 7px 7px; }
      .usb-drive::before { top: -13px; width: 24px; height: 14px; }
      .usb-drive::after { top: -9px; left: calc(50% - 4px); width: 8px; height: 9px; }
      .usb-inlay { inset: 5px; padding: 8px 0 6px; border-radius: 6px; }
      .usb-mark { width: 30px; height: 30px; border-radius: 8px; font-size: 12px; }
      .chip-code { font-size: 6px; }
      .choice-name { grid-area: name; font-size: 28px; }
      .choice-description { grid-area: desc; margin: 3px 0 0; font-size: 11px; }
      .choice-cta { grid-area: cta; margin-top: 12px; font-size: 8px; }
      .bottom-note, .status { font-size: 7px; }
    }
    @media (max-height: 650px) and (min-width: 701px) {
      .viewport { padding-top: 18px; padding-bottom: 16px; }
      .choice { min-height: 72svh; }
      .chip { height: 160px; width: 100px; margin-bottom: 20px; }
      .choice-index { margin-bottom: 15px; }
      .choice-cta { margin-top: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
      .choice:hover .chip, .choice:focus-visible .chip { transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>
  <main class="viewport">
    <div class="topline">
      <div class="signature"><span class="signature-mark"></span><span>MARCO SCATASSI <span style="opacity:.45">/</span> PERSONAL HUB</span></div>
      <div class="coordinates">A PERSONAL DIGITAL SPACE <span style="color:var(--cyan)">— 01 / 02</span></div>
    </div>

    <section class="experience" aria-label="Scegli la tua destinazione">
      <button class="choice" type="button" data-target="portfolio.html" data-reader="portfolio" aria-label="Apri Portfolio: competenze, progetti e contatti">
        <span class="choice-index">01 <span>— PROFESSIONAL</span></span>
        <span class="chip professional" aria-hidden="true"><span class="usb-drive"><span class="usb-inlay"><span class="usb-mark"><i class="fa-solid fa-terminal"></i></span><span class="chip-code">PH / 01</span><span class="usb-led"></span></span></span></span>
        <span class="choice-name">Portfolio</span>
        <span class="choice-description">Competenze, progetti e contatti</span>
        <span class="choice-cta">Explore portfolio <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
      </button>

      <button class="choice personal" type="button" data-target="personal.html" data-reader="personal" aria-label="Apri Personal: musica, natura e diario">
        <span class="choice-index">02 <span>— PERSONAL</span></span>
        <span class="chip personal" aria-hidden="true"><span class="usb-drive"><span class="usb-inlay"><span class="usb-mark"><i class="fa-solid fa-compass"></i></span><span class="chip-code">PH / 02</span><span class="usb-led"></span></span></span></span>
        <span class="choice-name">Personal</span>
        <span class="choice-description">Musica, natura e diario</span>
        <span class="choice-cta">Enter personal space <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
      </button>
    </section>

    <footer class="bottomline">
      <span class="bottom-note">DESIGNED AS A SPACE, NOT A WEBSITE</span>
      <span class="status">SYSTEM READY</span>
    </footer>
  </main>
  <script>
    const finePointer = window.matchMedia('(pointer:fine)').matches;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (finePointer && !reducedMotion) {
      window.addEventListener('pointermove', event => {
        document.documentElement.style.setProperty('--mouse-x', event.clientX + 'px');
        document.documentElement.style.setProperty('--mouse-y', event.clientY + 'px');
      }, { passive: true });
    }

    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [], width = 0, height = 0, animationFrame;
    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width * dpr; canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      particles = Array.from({ length: Math.min(42, Math.floor(width / 30)) }, () => ({
        x: Math.random() * width, y: Math.random() * height,
        vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18,
        radius: .8 + Math.random() * 1.2
      }));
    }
    function drawNetwork() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach((particle, index) => {
        if (!reducedMotion) {
          particle.x += particle.vx; particle.y += particle.vy;
          if (particle.x < 0 || particle.x > width) particle.vx *= -1;
          if (particle.y < 0 || particle.y > height) particle.vy *= -1;
        }
        ctx.beginPath(); ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(8,127,156,.4)'; ctx.fill();
        for (let next = index + 1; next < particles.length; next++) {
          const other = particles[next], distance = Math.hypot(particle.x - other.x, particle.y - other.y);
          if (distance < 118) {
            ctx.beginPath(); ctx.moveTo(particle.x, particle.y); ctx.lineTo(other.x, other.y);
            ctx.strokeStyle = `rgba(8,127,156,${(1 - distance / 118) * .1})`; ctx.lineWidth = 1; ctx.stroke();
          }
        }
      });
      if (!reducedMotion) animationFrame = requestAnimationFrame(drawNetwork);
    }
    resizeCanvas(); drawNetwork();
    window.addEventListener('resize', () => {
      cancelAnimationFrame(animationFrame); resizeCanvas(); drawNetwork();
    }, { passive: true });

    const choices = [...document.querySelectorAll('.choice')];
    let navigating = false;
    choices.forEach(choice => choice.addEventListener('click', () => {
      if (navigating) return;
      navigating = true;
      choices.forEach(item => item.disabled = true);
      const target = choice.dataset.target;
      const chip = choice.querySelector('.chip');
      try {
        sessionStorage.setItem('ph-chip-transition', JSON.stringify({ target: target.split('/').pop() }));
      } catch (_) {}
      // Il browser abbina il chip sorgente a quello della pagina di arrivo
      // e interpola posizione e dimensioni durante la navigazione cross-document.
      if (!reducedMotion) chip.style.viewTransitionName = 'hub-chip-flight';
      window.location.assign(target);
    }));
    window.addEventListener('pageshow', () => {
      choices.forEach(choice => { choice.disabled = false; });
      navigating = false;
    });
  </script>
</body>
</html>
