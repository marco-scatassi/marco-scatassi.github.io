
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imposta password — Personal Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f8fc;
      color: #172638;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
    }
    main {
      background: white;
      padding: 32px;
      border-radius: 18px;
      width: min(380px, calc(100% - 48px));
      box-shadow: 0 12px 40px #17263815;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }
    input { border: 1px solid #ccd5df; }
    button {
      border: 0;
      background: #00aeca;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    #message { font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
<main>
  <h1>Imposta la password</h1>
  <p>Scegli una password per accedere al tuo Personal Hub.</p>

  <form id="password-form">
    <input id="password" type="password"
      placeholder="Nuova password" minlength="8" required>
    <input id="confirm" type="password"
      placeholder="Conferma password" minlength="8" required>
    <button type="submit">Salva password</button>
  </form>

  <p id="message" role="status"></p>
</main>

<script>
  const SUPABASE_URL = "https://iszuojmfzolohktlkkau.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ID9CLw3gb1TSueyzlRVGpg_JZsvxLTN";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  const form = document.getElementById("password-form");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (password !== confirm) {
      message.textContent = "Le password non coincidono.";
      return;
    }

    message.textContent = "Salvataggio in corso...";

    try {
      const { data: { session }, error: sessionError } =
        await supabaseClient.auth.getSession();

      if (sessionError) throw sessionError;
      if (!session) {
        throw new Error(
          "Link non valido o scaduto. Richiedi una nuova email."
        );
      }

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) throw error;

      message.textContent =
        "Password impostata correttamente. Ora puoi accedere.";

      form.reset();

      setTimeout(() => {
        window.location.href = "./index.html";
      }, 2000);

    } catch (error) {
      message.textContent = error.message;
    }
  });
</script>
</body>
</html>
