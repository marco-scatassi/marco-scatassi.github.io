<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Fotografico</title>
    <link rel="stylesheet" href="style.css"> <!-- Assicurati che il percorso del CSS sia corretto -->
</head>
<body>

    <main class="album-container">
        <h1>Il mio Album</h1>
        
        <!-- Griglia Creativa per le Foto -->
        <div class="photo-gallery">
            <!-- Ripeti questo blocco per ogni foto -->
            <div class="photo-card">
                <img src="percorso/alla/tua/foto1.jpg" alt="Foto galleria" loading="lazy">
            </div>
            
            <div class="photo-card">
                <img src="percorso/alla/tua/foto2.jpg" alt="Foto galleria" loading="lazy">
            </div>

            <div class="photo-card">
                <img src="percorso/alla/tua/foto3.jpg" alt="Foto galleria" loading="lazy">
            </div>
            <!-- Fine blocco -->
        </div>
    </main>

</body>
</html>
