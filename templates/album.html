<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Album | Marco Scatassi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stoneBg: '#f7f6f0',
                        cardBg: '#ffffff',
                        earthText: '#2d3748',
                        accentSage: '#4a7c59'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stoneBg text-earthText font-sans antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-stoneBg/90 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="personal/nature.html" class="text-sm font-semibold text-accentSage hover:underline flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Torna al Photobook
            </a>
            <span id="nav-album-name" class="font-bold text-stone-900 tracking-wide uppercase text-xs md:text-sm">Caricamento...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-16 space-y-12">
        <div class="space-y-3 text-center max-w-2xl mx-auto">
            <h1 id="album-title" class="text-4xl md:text-5xl font-extrabold text-stone-900 capitalize tracking-tight">Album</h1>
            <div class="w-12 h-1 bg-accentSage mx-auto rounded-full"></div>
        </div>

        <!-- Griglia Editoriale Creativa (Asimmetrica) -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 auto-rows-[280px]">
            <!-- Le foto verranno inserite qui dinamicamente -->
        </div>

        <!-- Stato di Caricamento -->
        <div id="loading-notice" class="bg-cardBg border border-stone-200 rounded-3xl p-16 text-center text-stone-500 space-y-3 shadow-sm">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-accentSage"></i>
            <p class="font-medium text-sm">Caricamento degli scatti in corso...</p>
        </div>

        <!-- Stato Vuoto -->
        <div id="empty-notice" class="hidden bg-cardBg border border-stone-200 rounded-3xl p-16 text-center text-stone-500 space-y-3 shadow-sm">
            <i class="fa-solid fa-images text-4xl text-stone-300"></i>
            <p class="font-medium">Nessuna foto trovata in questa cartella.</p>
        </div>
    </main>

    <!-- Lightbox Modale Immersivo -->
    <div id="lightbox" class="fixed inset-0 z-50 hidden bg-stone-950/90 backdrop-blur-md flex items-center justify-center p-4 md:p-8" onclick="closeLightbox()">
        <div class="relative max-w-5xl w-full h-full flex items-center justify-center" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute top-4 right-4 z-10 w-12 h-12 rounded-full bg-stone-900/80 text-white flex items-center justify-center hover:bg-stone-800 transition shadow-lg text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl border border-stone-800">
        </div>
    </div>

    <script>
        // Legge l'ID dell'album dall'URL (es. album.html?id=heart-of-the-rockies)
        const urlParams = new URLSearchParams(window.location.search);
        const albumId = urlParams.get('id') || 'montagna';

        // Formatta il titolo rimuovendo i trattini
        const formattedTitle = albumId.replace(/-/g, ' ');
        document.getElementById('page-title').textContent = formattedTitle + " | Marco Scatassi";
        document.getElementById('nav-album-name').textContent = formattedTitle;
        document.getElementById('album-title').textContent = formattedTitle;

        // Chiamata alle API di GitHub per leggere i file nella cartella corrispondente
        const repoOwner = "marco-scatassi";
        const repoName = "marco-scatassi.github.io";
        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/images/${albumId}`;

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error("Cartella non trovata");
                return response.json();
            })
            .then(files => {
                document.getElementById('loading-notice').classList.add('hidden');
                const grid = document.getElementById('gallery-grid');
                
                // Filtra solo i file immagine
                const imageFiles = files.filter(file => file.type === 'file' && /\.(jpg|jpeg|png|webp)$/i.test(file.name));

                if (imageFiles.length > 0) {
                    imageFiles.forEach((file, index) => {
                        const item = document.createElement('div');
                        
                        // DESIGN CREATIVO ASIMMETRICO:
                        // Assegnamo layout differenti in base all'indice per creare movimento (stile rivista)
                        let spanClass = "rounded-3xl overflow-hidden shadow-sm border border-stone-200/80 bg-stone-200 cursor-pointer group relative transition-all duration-500 hover:shadow-xl hover:-translate-y-1";
                        
                        if (index % 5 === 0) {
                            spanClass += " md:col-span-2 md:row-span-2"; // Foto grande in evidenza
                        } else if (index % 3 === 0) {
                            spanClass += " md:row-span-2"; // Foto verticale alta
                        } else {
                        spanClass += " h-full"; // Formato standard
                    }

                        item.className = spanClass;
                        item.onclick = () => openLightbox(file.download_url);
                        
                        item.innerHTML = `
                            <div class="w-full h-full overflow-hidden relative">
                                <img src="${file.download_url}" alt="Scatto fotografico" class="w-full h-full object-cover group-hover:scale-105 transition duration-700 ease-out">
                                <div class="absolute inset-0 bg-stone-900/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                                    <span class="w-12 h-12 rounded-full bg-white/90 text-stone-900 flex items-center justify-center shadow-lg transform scale-75 group-hover:scale-100 transition duration-300">
                                        <i class="fa-solid fa-expand text-sm"></i>
                                    </span>
                                </div>
                            </div>
                        `;
                        grid.appendChild(item);
                    });
                } else {
                    document.getElementById('empty-notice').classList.remove('hidden');
                }
            })
            .catch(error => {
                document.getElementById('loading-notice').classList.add('hidden');
                document.getElementById('empty-notice').classList.remove('hidden');
                console.error("Errore nel recupero delle foto da GitHub:", error);
            });

        function openLightbox(src) {
            const modal = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Blocca lo scroll di fondo
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.body.style.overflow = 'auto'; // Ripristina lo scroll
        }
    </script>
</body>
</html>
