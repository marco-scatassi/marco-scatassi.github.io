<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario | Marco Scatassi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stoneBg: '#f7f6f0',
                        cardBg: '#ffffff',
                        earthText: '#2d3748',
                        softBlue: '#3d5a80'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stoneBg text-earthText font-sans antialiased">
    <header class="sticky top-0 z-50 bg-stoneBg/90 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="../personal.html" class="text-sm font-semibold text-softBlue hover:underline flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Spazio Personale
            </a>
            <span class="font-bold text-stone-900">Diario & Note</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-16 space-y-8">
        <div class="space-y-4">
            <h1 class="text-4xl font-extrabold text-stone-900">Note & Riflessioni</h1>
            <p class="text-stone-600 text-lg">Uno spazio pronto ad accogliere i futuri articoli e thoughts personali.</p>
        </div>

        <div class="bg-cardBg border border-dashed border-stone-300 rounded-3xl p-16 text-center space-y-3 shadow-sm">
            <i class="fa-solid fa-pen-fancy text-4xl text-stone-400"></i>
            <h3 class="text-xl font-bold text-stone-800">Nessun articolo pubblicato</h3>
            <p class="text-sm text-stone-600 max-w-md mx-auto">Qui potrai aggiungere le tue riflessioni e i tuoi testi in qualsiasi momento.</p>
        </div>
    </main>
</body>
</html>
