<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natura | Marco Scatassi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stoneBg: '#f7f6f0',
                        cardBg: '#ffffff',
                        earthText: '#2d3748',
                        accentSage: '#4a7c59'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stoneBg text-earthText font-sans antialiased">
    <header class="sticky top-0 z-50 bg-stoneBg/90 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="../personal.html" class="text-sm font-semibold text-accentSage hover:underline flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Spazio Personale
            </a>
            <span class="font-bold text-stone-900">Natura & Sentieri</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-16 space-y-8">
        <div class="space-y-4">
            <h1 class="text-4xl font-extrabold text-stone-900">Trekking & Aria Aperta</h1>
            <p class="text-stone-600 text-lg">Passeggiate nei boschi, sentieri di montagna e la tranquillità dei paesaggi naturali.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="h-64 rounded-3xl bg-stone-200 flex items-end p-6 border border-stone-300">
                <span class="text-stone-800 text-sm font-semibold bg-white/80 px-4 py-2 rounded-xl backdrop-blur-sm shadow-sm">Montagna e Paesaggi</span>
            </div>
            <div class="h-64 rounded-3xl bg-stone-200 flex items-end p-6 border border-stone-300">
                <span class="text-stone-800 text-sm font-semibold bg-white/80 px-4 py-2 rounded-xl backdrop-blur-sm shadow-sm">Boschi e Tranquillità</span>
            </div>
        </div>
    </main>
</body>
</html>
